services:
  # Spring Boot Backend API Service
  snd-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: snd-backend
    restart: always
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/snd_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: snd_user
      SPRING_DATASOURCE_PASSWORD: '4>2k"8OdhP6R'
      APP_CORS_ALLOWED_ORIGINS: https://snd.ainext.site,http://localhost:3201,http://localhost:80,http://localhost:5173
    networks:
      - sas-net

  # React Frontend (Nginx) Service
  snd-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: snd-frontend
    restart: always
    depends_on:
      - snd-backend
    ports:
      - "3201:80"
    networks:
      - sas-net

networks:
  sas-net:
    external: true
