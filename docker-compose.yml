services:
  # Spring Boot Backend API Service
  snd-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: snd-backend
    restart: always
    ports:
      - "8081:8080"
    environment:
      TZ: "Asia/Dhaka"
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Dhaka"
      SPRING_DATASOURCE_URL: ${DB_URL:-jdbc:mysql://mysql-db:3306/snd_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Dhaka&characterEncoding=UTF-8}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-snd_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-4>2k"8OdhP6R}
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_URLS:-http://localhost:3201}
      APP_SMS_BASE_URL: ${APP_SMS_BASE_URL:-}
      APP_SMS_API_KEY: ${APP_SMS_API_KEY:-}
      APP_SMS_SECRET_KEY: ${APP_SMS_SECRET_KEY:-}
      APP_SMS_CALLER_ID: ${APP_SMS_CALLER_ID:-}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-mail.ainext.site}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-}
      APP_MAIL_FROM_NAME: ${APP_MAIL_FROM_NAME:-IPTSP Recharge Distribution}
     
    networks:
      - sas-net

  # React Frontend (Nginx) Service
  snd-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: snd-frontend
    restart: always
    depends_on:
      - snd-backend
    ports:
      - "3201:80"
    environment:
      TZ: "Asia/Dhaka"
    networks:
      - sas-net

networks:
  sas-net:
    external: true
