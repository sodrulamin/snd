services:
  # Spring Boot Backend API Service
  snd-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: snd-backend
    restart: always
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: ${DB_URL:-jdbc:mysql://mysql-db:3306/snd_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-snd_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-4>2k"8OdhP6R}
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_URLS:-http://localhost:3201}
     
    networks:
      - sas-net

  # React Frontend (Nginx) Service
  snd-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: snd-frontend
    restart: always
    depends_on:
      - snd-backend
    ports:
      - "3201:80"
    networks:
      - sas-net

networks:
  sas-net:
    external: true
